tasks:
  - id: 1
    spec: 2
    implementation: |
      terminu-go 的單一畫面（Screen「Profiles」）：最上面一列 statusbar（task 7），下面 [1] PROFILES 在左、佔寬的三分之一，[2] DOMAINS 在右、佔其餘；最下面 terminu-go 的 footer
      [2] 是 [1] 的明細（Panel.Details），label 帶 [1] cursor 那個 profile 的名字：[2] DOMAINS: office
      panel 的 hint：[1] Enter:activate p:preview n:new；[2] Enter:edit n:new（[2] 沒有 profile 時 n 不在）
      沒有窄寬的排法：最低尺寸 60×24（task 2）以上兩個 panel 都畫，60 欄時 [1] 20、[2] 40 欄寬，80 欄時 [1] 26 欄寬
      tdptest 走遍 app：各種尺寸與 icon 寬度下，每個 panel 開關 Space menu、global operation popup、App Log、key reference，再縮到最低尺寸以下；每一格每一列都等於終端機寬、沒有送控制字元給終端機。一般的值走一次，profile 名字與 hosts 檔路徑帶控制字元的再走一次（照 components 的控制字元畫成紅色的名字）
    test: [TestTDP, TestTDPWithTrickyValues]
  - id: 2
    spec: 2
    implementation: |
      最低尺寸 60×24（App.MinWidth、MinHeight）；比這小時 terminu-go 只畫三列「hostu」、「needs a terminal of at least 60×24」、「Press [Ctrl-C] twice to quit」，放不下時先拿掉尺寸那列、再拿掉離開那列，一列比畫面寬也算放不下；按鍵都不作用，只有連按兩次 Ctrl-C 離開；拉大回到原本的畫面，開著的 popup 還在
      每個畫面與 hostu 開的每個 popup（含 toast、error popup、MOVE ASIDE、sudo 的 PASSWORD password popup、doas 的 terminal popup、App Log），在 60×24、60×32、80×24、120×40、160×50、三種 icon／powerline 寬度（1/1、2/1、2/2）下，每一列都等於終端機寬
      popup 開著時終端機縮小：popup 照打開時的大小，超出畫面的部分切掉（terminu-go 畫），縮到 60×5、1×1 也不當掉
      tdptest 的 Check 在 60×32 跑一輪，也查最低尺寸不高於 60×32
    test: [TestL1BelowTheLeastSize, TestL4EveryLineIsTheTerminalsWidth, TestE5PopupBiggerThanTheScreen]
  - id: 3
    spec: 1
    implementation: |
      icon 與 powerline 符號的寬度由 terminu-go 啟動時量，覆寫照 HOSTU__ → TERMINU__ → LC_TERMINU_ 的順序讀（README）
      README 的需求段寫 Nerd Font、truecolor 與六個變數
    test:
      - commit: 8c5b006
  - id: 4
    spec: 1
    implementation: |
      cmd/hostu：沒有參數就啟動；version、-v、--version 印 version.Display()（發版是 v<版號>，本機 build 是 dev）；help、-h、--help 印命令列的用法（指令三行，加上 profiles.yaml 在哪、HOSTU__DATA 與 HOSTU__HOSTS_FILE）
      其他參數：stderr 寫「hostu: unknown command "<參數>"」與用法，exit 2
      Run 回錯（MOVE ASIDE 的 Esc、找不到家目錄）：stderr 寫「hostu: <錯誤>」，exit 1
    test:
      - commit: 8c5b006
  - id: 5
    spec: 4
    implementation: |
      [1] PROFILES 是 terminu-go 的清單（List.Flags），標記欄之後兩欄：NAME（可以截短，最少 12 格）、DOMAINS（domain 的數目，數字靠右，放不下時第一個收；icon 佔一格時 [1] 要 26 欄、畫面 78 欄以上才放得下）
      標記欄：生效中的那一列的旗標（Row.Flag）是 Green 的 nf-md-check_circle，其他列與表頭空白，寬度是 icon 的寬度加一格（terminu-go 畫）；NAME 的表頭與每一列的名稱同一欄，icon 佔一格或兩格都一樣
      順序是 profiles.yaml 裡的順序；新增、複製、匯入的加在最後。每次啟動同一份 profiles.yaml 畫出來一樣
      cursor 移動時 [2] 跟著換（task 6）
      空的時候（profiles.yaml 有、但一個 profile 都沒有）：「No profiles yet」、「Press [n] to make one, [i] to read the hosts file into one, or [Space] to see what you can do here」；item operation 沒有對象，Space menu 沒有那一區，hint 只剩 n:new（terminu-go 照 Action 的 Scope 拿掉）
      profiles.yaml 讀不了時不畫清單，先問 MOVE ASIDE（task 26）
      Space menu 的 item operation：[Enter] Activate、[p]review、[r]ename、[c]opy、[D]elete；panel operation：[n]ew、[i]mport（各 task）
    test: [TestLongNameIsCut, TestNameStandsOverTheNames, TestSameEveryStart, TestEmptyListsHint]
  - id: 6
    spec: 1
    implementation: |
      [2] DOMAINS: <profile>：terminu-go 的清單，DOMAIN、ADDRESSES 兩欄，都可以截短，放不下時先收 ADDRESSES；一個 domain 的位址用「, 」接在同一格（127.0.0.1, ::1）
      [1] 的 cursor 一移動就換成那個 profile 的 domain，label 跟著換；順序是 profile 裡的順序，新加的在最後
      profile 沒有 domain：「No domains in <profile>」、「Press [n] to add one, or [Space] to see what you can do here」；Space menu 沒有 item operation 那一區，hint 只剩 n:new
      沒有 profile 可以顯示：「No profile to show」、「Press [1] to go to the profiles」；這時 [n]ew 也不在，下框不寫 hint
      Space menu 的 item operation：[Enter] Edit、[D]elete；panel operation：[n]ew（task 18–20）
    test: [TestFirstStartMakesDefault, TestNewProfile, TestNewDomain, TestEmptyListsHint]
  - id: 7
    spec: 1
    implementation: |
      statusbar 一列：「hosts: <hosts 檔路徑> 」（Overlay0；路徑最多佔寬的三分之一、至少 12 格，太長從前面截）、狀態、「  active: 」（Overlay0）、生效中的 profile（Lavender；沒有時寫 none，Overlay0）
      狀態補成「(can't read)」的寬度：hosts 檔跟生效中的 profile 一樣是「(in sync)」（Overlay0），不一樣是「(differs)」（Peach），hosts 檔讀不了是「(can't read)」（Red），沒有生效中的 profile 時空白
      比的是 hosts 檔讀出來的 domain 與位址（task 24 的讀法），跟生效中的 profile 照順序一樣才算一樣；hosts 檔在啟動時與寫完之後讀（task 25），改了 profile 不會寫 hosts 檔，所以會變成 (differs)，再啟用一次回到 (in sync)
    test: [TestStatusSaysTheHostsFileDiffers, TestHostsFileCantBeRead]
  - id: 8
    spec: 3
    implementation: |
      啟動時（MOVE ASIDE 都問完之後）沒有 profiles.yaml：讀 hosts 檔（task 24），做成 default、標成生效中，存進 profiles.yaml；不寫 hosts 檔，不建 config.yaml
      toast：Info「Made the profile default from <hosts 檔路徑>」；有跳過的行時 Warning「Made the profile default from <路徑>, skipped <N> line(s)」；App Log 照記
      存不了：error popup「CAN'T SAVE: <profiles.yaml 路徑>」與原因
      hosts 檔讀不了：error popup「CAN'T READ: <路徑>」（task 25），不建 default，[1] 是空的
      第二次啟動起不再做這些
    test: [TestFirstStartMakesDefault, TestFirstStartSaysWhatItSkipped]
  - id: 9
    spec: 3
    implementation: |
      [1] 的 Enter（Space menu「[Enter] Activate — write it to the hosts file」）：開 confirm「ACTIVATE: <profile>」
      內容「The hosts file gets <N> domain(s), and nothing else.」；profile 沒有 localhost（大小寫不分）時多一列 Peach 的警告「<profile> has no localhost: programs that connect to localhost stop working.」
      問句「Write <profile> to <hosts 檔路徑>?」，hint Enter:write Esc:cancel
      Enter：先留舊的 hosts 檔（task 11），再寫 hosts 檔（task 10，不擋住畫面）；寫完再讀一次 hosts 檔，profile 標成生效中、存 profiles.yaml，Success toast「Wrote <profile> to <hosts 檔路徑>」（App Log 照記），statusbar 換成它、(in sync)
      寫失敗：error popup「WRITE FAILED: <hosts 檔路徑>」與原因，生效中的不變
      寫好了、但存 profiles.yaml 失敗：error popup「CAN'T SAVE: <profiles.yaml 路徑>」「The hosts file has <profile>, but it is not kept as the active profile. <原因>」，生效中的不變
      Esc：什麼都不寫；已經生效的 profile 也可以再啟用一次（重寫 hosts 檔）
    test: [TestActivateWritesTheHostsFile, TestActivateEscWritesNothing, TestActivateWarnsWithoutLocalhost]
  - id: 10
    spec: 4
    implementation: |
      hostu 用自己的帳號跑；寫 hosts 檔時先自己寫，可以就好
      沒有權限（permission denied）時，內容寫進暫存檔，以管理員身分複製過去：
      macOS、Linux：用 sudo，沒有就 doas；把「cp <暫存檔> <hosts 檔>」交給 terminu-go 的 App.Elevate（Verb write、Subject 是 hosts 檔），hostu 只給指令：
      - sudo：terminu-go 先試 sudo -n，不用密碼就直接複製，不開任何東西；要密碼時開 PASSWORD 的 password popup（解鎖方案，Enter:write Backspace:clear Esc:cancel），密碼只交給 sudo -S；打錯時框不關、點清掉、錯誤列「Wrong password」
      - doas：terminu-go 先試 doas -n，不用密碼就直接複製；要密碼時開 terminal popup 跑 doas，讓它自己問，跑完 popup 自己關；這個 PTY 沒有歷史與選取模式
      - 複製成功：跟自己寫好一樣（task 9 的 toast），暫存檔刪掉
      - 複製失敗（ElevateError）：error popup「WRITE FAILED: <路徑>」只寫說原因的那一行「Could not write it with <工具>: <輸出的第一個非空行>」（沒有輸出時寫結束的錯誤）；輸出好幾行時全文接成一列記進 App Log：Info「Output of <工具>: <全部的行>」；暫存檔刪掉
      - 在密碼框按 Esc：複製不跑，暫存檔刪掉，hosts 檔與生效中的 profile 不變，App Log 不記
      密碼 hostu 拿不到：不寫進檔案、不進 App Log、不出現在畫面上
      都沒有：error popup「WRITE FAILED: <路徑>」「No permission to write <路徑>, and neither sudo nor doas is there to write it as the administrator.」
      Windows：用 gsudo，沒有就 Windows 11 的 sudo，跑 powershell 的 Copy-Item，系統跳 UAC；都沒有「No permission to write <路徑>. Install gsudo (scoop install gsudo), or open the terminal as the administrator.」
      Windows 的複製失敗：error popup「WRITE FAILED: <路徑>」只寫說原因的那一行「Could not write it with <工具>: <輸出的第一個非空行>」（沒有輸出時寫結束的錯誤）；輸出好幾行時，全文接成一列記進 App Log：Info「Output of <工具>: <全部的行>」
      其他寫入錯誤直接開 error popup；暫存檔用完刪掉
    test: [TestWriteItself, TestWriteHandsTheCopyBack, TestWriteNoSudo, TestWriteWindows, TestWriteWindowsFails, TestWriteFailsSaysWhy, TestSudoAsksForThePassword, TestSudoEscWritesNothing, TestSudoCopyFails, TestDoasAsksInATerminal]
  - id: 11
    spec: 3
    implementation: |
      每次啟用寫 hosts 檔之前：資料目錄（~/.hostu，HOSTU__DATA）沒有 hosts.original 時，把 hosts 檔原樣複製過去（需要時先建資料目錄），App Log 記 Info「Kept <hosts 檔> as it was in <hosts.original 的路徑>」（家目錄寫 ~）
      已經有 hosts.original、或 hosts 檔不存在：不動
      複製失敗：不寫 hosts 檔，error popup「WRITE FAILED: <hosts 檔路徑>」與原因
    test: [TestActivateWritesTheHostsFile, TestAppLog]
  - id: 12
    spec: 3
    implementation: |
      [1] 的 p（Space menu「[p]review — the hosts file it writes」，item operation）：開 terminu-go 的 viewer「HOSTS FILE — <profile>」（glyph nf-md-file_document），內容是啟用時會寫成的 hosts 檔（task 24 的寫法），一行一行
      打開時記進 App Log：Info「Previewed the profile <profile>」
    test: [TestPreview, TestAppLog]
  - id: 13
    spec: 3
    implementation: |
      [1] 的 r（Space menu「[r]ename — give it another name」，item operation）：開 text input「RENAME: <profile>」（glyph nf-md-pencil），說明列「New name for <profile>」，舊名字是灰字提議，hint 的動詞 rename
      確定時（terminu-go 的 text input，task 14、16、17 的名字也是同一個）：先檢查控制字元，有就擋下「Name can't have control characters」；再去掉前後的空白字元（Unicode 的空白）；接著 hostu 檢查：空的「Name can't be empty」，跟別的 profile 同名（大小寫不分，跟自己不算）「There is a profile named <名字> already」；寫在錯誤列，popup 不關
      （hostu 的「A name has no space at either end」「A name has no control characters」只用在讀手改的 profiles.yaml，task 21；從 input 走不到）
      通過：改名、生效中的 profile 跟著改名，存 profiles.yaml；cursor 留在它上面，[2] 的 label 與 statusbar 跟著換；App Log 記「Renamed the profile <舊> to <新>」
      存失敗：名字改回去，input popup 留著、值還在，error popup 蓋在上面；關掉後再按 Enter 就是重試
    test: [TestRenameTheActiveProfile, TestNewProfile, TestNameSpacesAndControlCharacters, TestSaveFailsKeepsTheInput]
  - id: 14
    spec: 3
    implementation: |
      [1] 的 c（Space menu「[c]opy — a new profile with its domains」，item operation）：開 text input「COPY: <profile>」（glyph nf-md-content_copy），說明列「Name of the copy」，建議值「<profile> copy」（有了就「<profile> copy 2」、3…），hint 的動詞 copy
      名字的檢查與存失敗照 task 13
      通過：加一個新的 profile，domain 與位址照抄一份（不共用），加在最後、存 profiles.yaml，cursor 移到它上面；App Log 記「Copied the profile <原本> to <新>」
    test: [TestCopyProfile]
  - id: 15
    spec: 3
    implementation: |
      [1] 的 D（Space menu「[D]elete — take it away, with its domains」，item operation）：生效中的 profile 上停用（Space menu 那一列停用色，按 D 不作用）
      其他 profile：開 confirm「DELETE: <profile>」，內容「It has no domains.」／「Its one domain goes with it.」／「Its <N> domains go with it.」，問句「Delete the profile <profile>?」，hint Enter:delete Esc:cancel
      Enter：拿掉、存 profiles.yaml；App Log 記「Deleted the profile <profile>」。存失敗：放回原位，error popup「CAN'T SAVE: <profiles.yaml 路徑>」與原因
      Esc：不動
      從 Space menu 執行的：confirm 疊在 menu 上，Esc 回到 menu；Enter 刪掉之後沒有打開東西（Action 沒設 Stay），menu 跟著關；存失敗時 error popup 打開，menu 留在底下
    test: [TestDeleteProfile, TestDeleteFromTheMenuClosesIt]
  - id: 16
    spec: 3
    implementation: |
      [1] 的 n（Space menu「[n]ew — an empty profile」，panel operation）：開 text input「NEW PROFILE」（glyph nf-md-pencil），說明列「Name of the new profile」，沒有建議值，hint 的動詞 add
      名字的檢查與存失敗照 task 13
      通過：加一個沒有 domain 的 profile，加在最後、存 profiles.yaml，cursor 移到它上面，[2] 是它的空狀態；App Log 記「Made the profile <名字>」
    test: [TestNewProfile, TestNameSpacesAndControlCharacters, TestSaveFailsKeepsTheInput]
  - id: 17
    spec: 3
    implementation: |
      [1] 的 i（Space menu「[i]mport — the hosts file as it is now, as a new profile」，panel operation）：開 text input「IMPORT: <hosts 檔路徑>」（glyph nf-md-import），說明列「Name of the profile made from it」，建議值「imported」（有了就「imported 2」、3…），hint 的動詞 import
      名字的檢查與存失敗照 task 13
      通過：這時再讀一次 hosts 檔（讀不了：error popup 蓋在 input popup 上），照 task 24 讀成 domain，加成新的 profile、在最後、存 profiles.yaml，cursor 移到它上面
      toast：Success「Imported <N> domain(s) from <hosts 檔路徑>」；有跳過的行時 Warning「…, skipped <N> line(s)」；App Log 照記
    test: [TestImportTheHostsFile]
  - id: 18
    spec: 3
    implementation: |
      [2] 的 n（Space menu「[n]ew — a domain and its addresses」，panel operation；[2] 沒有 profile 時沒有這一項）：開 terminu-go 的表單「NEW DOMAIN」（glyph nf-md-web），兩欄左右式：Domain、Addresses，空的寫「not set」；按鈕 Add
      Domain 的 Enter：text input「DOMAIN」，說明列「A name, as git.corp.local」；確定時檢查：空的「Domain can't be empty」；只能有英文字母、數字、-、_、.（「A domain has only letters, digits, -, _ and ., not <那個字>」）；點之間不能空（「A domain has no empty part between its dots」）；點之間最多 63 字、全部最多 253 字；寫在錯誤列，popup 不關
      Addresses 的 Enter：text input「ADDRESSES」，說明列「IPv4 or IPv6 addresses, between spaces」；確定時 terminu-go 先檢查控制字元（貼上的 Tab、換行…），有就擋下「Addresses can't have control characters」，再去掉前後的空白；接著 hostu 用空白或逗號分開，每一個要是 IPv4 或 IPv6（可以帶 zone），不是的寫「<值> is not an IPv4 or IPv6 address」；空的「Addresses can't be empty」；重複的只留一個
      Domain 的控制字元也一樣先由 terminu-go 擋下（「Domain can't have control characters」）
      按 Add 時檢查整張表單：「Domain is required」、「<domain> is in <profile> already」（大小寫不分）、「Addresses are required」，照表單的錯誤列與 Red 的 label
      通過：加在 profile 的最後、存 profiles.yaml，cursor 移到它上面，表單與底下的 Space menu 一起關掉；App Log 記「Added <domain> to the profile <profile>」。存失敗：不加，terminu-go 開 error popup 蓋在表單上
    test: [TestNewDomain, TestCheckDomain, TestAddresses, TestPastedTabInAddresses]
  - id: 19
    spec: 3
    implementation: |
      [2] 的 Enter（Space menu「[Enter] Edit — the domain and its addresses」，item operation）：開表單「EDIT: <domain>」，欄位與檢查照 task 18，值帶入這個 domain 的，按鈕 Save；欄位的 input popup 裡舊值是灰字提議（Tab 收進來改）
      同名檢查不算自己
      通過：換掉那一筆、存 profiles.yaml，cursor 留在它上面；App Log 記「Saved <domain> in the profile <profile>」；從 Space menu 打開的，表單關掉後回到 Space menu。存失敗：不改，error popup 蓋在表單上
    test: [TestEditDomain]
  - id: 20
    spec: 3
    implementation: |
      [2] 的 D（Space menu「[D]elete — take the domain out of the profile」，item operation）：開 confirm「DELETE: <domain>」，問句「Delete <domain> from <profile>?」，hint Enter:delete Esc:cancel
      Enter：拿掉、存 profiles.yaml；App Log 記「Deleted <domain> from the profile <profile>」；hosts 檔不動（生效中的 profile 改了，statusbar 變成 (differs)）。存失敗：放回原位，error popup「CAN'T SAVE: <profiles.yaml 路徑>」與原因
      Esc：不動
      從 Space menu 執行的：照 task 15，Enter 刪掉之後 menu 跟著關，Esc 回到 menu
    test: [TestDeleteDomain, TestStatusSaysTheHostsFileDiffers, TestDeleteFromTheMenuClosesIt]
  - id: 21
    spec: 1
    implementation: |
      profiles.yaml 在 ~/.hostu（HOSTU__DATA 改位置），每改一次就寫一次（README、e0dd1cd）
      讀進來時檢查：名字裡沒有控制字元、名字不重複、domain 與位址是 hosts 檔收的（9080664）
    test: [TestSaveAndLoad, TestLoadChecksWhatIsInIt, TestTakenAndRemove]
  - id: 22
    spec: 1
    implementation: |
      config.yaml 在 $XDG_CONFIG_HOME/hostu，沒設就是 ~/.config/hostu（HOSTU__CONFIG 改位置）；只有 input_tab_width，預設 4（README）
      第一次打開不建 config.yaml，使用者自己寫了才有（2b78611）
    test: [TestLoad]
  - id: 23
    spec: 1
    implementation: |
      hosts 檔：/etc/hosts，Windows 是 %SystemRoot%\System32\drivers\etc\hosts；HOSTU__HOSTS_FILE 改（README）
    test:
      - commit: 8c5b006
  - id: 24
    spec: 1
    implementation: |
      讀：# 之後是註解；一行是一個位址加一個以上的名稱，位址要是 IPv4 或 IPv6、每個名稱要合 task 18 的規則，不合的整行跳過、算進跳過的行數；空行不算
      同一個名稱在好幾行（大小寫不分）收成一個 domain，位址照出現的順序、重複的只留一個
      寫：照 profile 寫整個檔：開頭兩行註解「# Written by hostu from the profile "<profile>".」、「# hostu writes this whole file again when you activate a profile: change it in hostu.」，接著每個 domain 的每個位址一行「<位址，補成一樣寬>  <domain>」；Windows 用 CRLF
      寫出來的再讀回去跟 profile 一樣
    test: [TestParse, TestFormatReadsBack]
  - id: 25
    spec: 3
    implementation: |
      啟動時（MOVE ASIDE 都問完之後）讀 hosts 檔；啟用寫完之後再讀一次；匯入時讀當下的（task 17）。不監看
